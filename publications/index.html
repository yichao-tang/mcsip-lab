<!doctype html>
<html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>实验室主页地址已更新</title>
<link rel="canonical" href="https://scau-mcsip.github.io/publications/">
<script>(() => {
  const oldBase = '/mcsip-lab';
  const currentPath = window.location.pathname;
  if (window.location.hostname !== 'yichao-tang.github.io' ||
      !(currentPath === oldBase || currentPath.startsWith(oldBase + '/'))) return;
  const target = new URL('https://scau-mcsip.github.io/');
  target.pathname = currentPath.slice(oldBase.length) || '/';
  target.search = window.location.search;
  target.hash = window.location.hash;
  window.location.replace(target.href);
})();</script>
<noscript><meta http-equiv="refresh" content="0;url=https://scau-mcsip.github.io/publications/"></noscript>
</head><body>
<p>实验室主页地址已更新。<a href="https://scau-mcsip.github.io/publications/">前往新主页</a></p>
</body></html>
